name: DIAG release signing (temporary)

# ---------------------------------------------------------------------------
# TEMPORARY diagnostic workflow. It mirrors the signing + build steps of
# build.yml but PUBLISHES NOTHING. Every fact is emitted as an annotation so it
# can be read back through the GitHub API (CI log archives are not reachable
# from the environment that is debugging them).
#
# Delete this file and scripts/diag_signing.sh once the release path is green.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - 'arena/01a0ec57-saxify-v1'
    paths:
      - '.github/workflows/diag_signing.yml'
      - 'scripts/diag_signing.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Diagnose release signing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Same step as build.yml — proves the secret decodes and validates.
      - name: Decode and validate release keystore
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_REQUIRED: 'true'
        shell: bash
        run: bash scripts/ci_prepare_signing.sh

      - name: DIAG 1 — keystore facts
        env:
          SIGNING_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_SHA256_OUT: ${{ steps.signing.outputs.keystore_sha256 }}
        shell: bash
        run: bash scripts/diag_signing.sh keystore

      - name: DIAG 2 — apksigner/keytool parse agreement
        shell: bash
        run: bash scripts/diag_signing.sh parse

      # Byte-identical env to build.yml's "Build signed release APK".
      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          SIGNING_KEYSTORE_TYPE: JKS
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release 2>&1 | tee build.log
          APK="build/app/outputs/flutter-apk/app-release.apk"
          [[ -f "$APK" ]] || { echo "::error::$APK was not produced"; exit 1; }
          echo "Built $(stat -c %s "$APK") bytes -> $APK"

      - name: DIAG 3 — built APK facts
        env:
          SIGNING_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: bash scripts/diag_signing.sh apk

      # The keystore has to exist while the diagnostics run, so clean up after.
      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP:-/tmp}/signing"
          rm -f android/app/upload-keystore.jks android/key.properties
          echo "Temporary keystore removed."

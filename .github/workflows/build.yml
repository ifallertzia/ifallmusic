name: Release build (signed APK)

# Publishes a signed release APK whenever a version tag is pushed.
#
# This is the workflow that keeps updates installable: it signs with the SAME
# release key every time, so Android never rejects the new APK with
# "App not installed as package conflicts with an existing package."
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEY      base64 of upload-keystore.jks   (`base64 -w 0 upload-keystore.jks`)
#   KEY_ALIAS        upload
#   KEY_PASSWORD     keystore key password
#   STORE_PASSWORD   keystore store password
#
# See docs/RELEASE_SIGNING.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit/ref to build (build_apk.yml passes the bump commit)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish signed release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # When called from build_apk.yml, github.sha is the PRE-bump merge
          # commit; `inputs.ref` points at the bump commit so the published
          # APK carries the incremented build number. Empty -> default ref.
          ref: ${{ inputs.ref || github.ref }}

      # JDK 21 matches AGP 9.1.0 / Gradle 9.3.1 used by this project.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ---------------------------------------------------------------------
      # Decode the keystore into a TEMPORARY path outside the checkout, then
      # prove it is usable BEFORE spending ~10 minutes on a Flutter build.
      # ---------------------------------------------------------------------
      # ---------------------------------------------------------------------
      # Decode the keystore into a TEMPORARY path outside the checkout, then
      # prove it is the pinned release key BEFORE spending ~10 minutes on a
      # Flutter build. Every failure path emits an annotation, because CI log
      # files are not always retrievable.
      # ---------------------------------------------------------------------
      - name: Decode and validate release keystore
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_REQUIRED: 'true'
        shell: bash
        run: bash scripts/ci_prepare_signing.sh

      - name: Analyze (errors only, infos non-fatal)
        shell: bash
        run: set -o pipefail && flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Test (unit + widget)
        shell: bash
        run: set -o pipefail && flutter test --reporter expanded 2>&1 | tee test.log

      # ---------------------------------------------------------------------
      # Gradle picks the credentials up from the environment; nothing is
      # written into the checkout and nothing is hardcoded in build.gradle.kts.
      # ---------------------------------------------------------------------
      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          SIGNING_KEYSTORE_TYPE: JKS
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release 2>&1 | tee build.log
          APK="build/app/outputs/flutter-apk/app-release.apk"
          [[ -f "$APK" ]] || { echo "::error::$APK was not produced"; exit 1; }
          # Gradle announces the debug fallback at WARN level, which is visible
          # here. Its "Release signing: ..." confirmation is LIFECYCLE level and
          # is swallowed by Flutter's Gradle invocation, so it can NOT be used as
          # evidence that the release config was applied — the certificate check
          # in the next step is the real gate.
          grep -iE "release signing|no release keystore|debug key" build.log | head -5 || true
          if grep -qiE "no release keystore|local debug key" build.log; then
            echo "::error title=Debug signing::Gradle fell back to the debug key even though the secrets were supplied."
            exit 1
          fi
          echo "Built $(stat -c %s "$APK") bytes -> $APK"

      # ---------------------------------------------------------------------
      # Prove the APK really carries the release certificate. This is the step
      # that guarantees we never publish another debug-signed APK again.
      #
      # The digest is matched by its PAYLOAD, never by field position:
      # apksigner has renamed this line at least once —
      #   build-tools <= 35:  "Signer #1 certificate SHA-256 digest: <hex>"
      #   build-tools 37:     "V2 Signer: certificate SHA-256 digest: <hex>"
      # — and a field-index parser read the LABEL instead of the digest on 37,
      # so every release failed with "APK is NOT signed with the release
      # keystore" while the APK was in fact signed correctly. The label is no
      # longer trusted and the 64-hex payload is mandatory.
      # ---------------------------------------------------------------------
      - name: Verify APK signature matches the release key
        env:
          EXPECTED_SHA256: ${{ steps.signing.outputs.keystore_sha256 }}
        shell: bash
        run: |
          set -uo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          [[ -f "$APK" ]] || { echo "::error::$APK is missing; nothing to verify."; exit 1; }

          # Signing-certificate SHA-256 (64 hex chars) from apksigner's output.
          # "certificate SHA-256 digest:" is anchored so the sibling
          # "public key SHA-256 digest:" line can never be picked up.
          cert_sha_from_apksigner_log() {
            grep -oE 'certificate SHA-256 digest:[[:space:]]*[0-9A-Fa-f]{64}' "$1" 2>/dev/null \
              | head -1 | grep -oE '[0-9A-Fa-f]{64}' | tr 'a-f' 'A-F'
          }
          # keytool prints it colon-separated ("SHA256: AB:CD:...").
          cert_sha_from_keytool_log() {
            awk -F': ' '/SHA256:/ {gsub(/:/,"",$2); print toupper($2); exit}' "$1" 2>/dev/null
          }
          # Non-secret tool output as an annotation: CI log archives are not
          # always retrievable, annotations are.
          notice_b64() { # notice_b64 <title> <file> [bytes]
            [[ -s "$2" ]] || return 0
            echo "::notice title=$1::$(head -c "${3:-1200}" "$2" | base64 -w0)"
          }

          # Locate apksigner. It understands v1/v2/v3/v4 schemes; keytool only
          # reads v1 (JAR) signatures, which modern minSdk builds may omit.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=""
          if [[ -n "$SDK_ROOT" ]]; then
            APKSIGNER="$(ls -d "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
            if [[ -z "$APKSIGNER" ]] && [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
              echo "apksigner not found — installing build-tools."
              yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null 2>&1 || true
              APKSIGNER="$(ls -d "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
            fi
          fi

          APK_SHA256=""
          if [[ -n "$APKSIGNER" ]]; then
            "$APKSIGNER" verify --print-certs -v "$APK" 2>&1 | tee apksigner.log || true
            echo "apksigner: ${APKSIGNER} ($("$APKSIGNER" --version 2>/dev/null | head -1))"
            APK_SHA256="$(cert_sha_from_apksigner_log apksigner.log)"
            # If the label changes again, the annotation carries the raw output.
            [[ -n "$APK_SHA256" ]] || notice_b64 "apksigner output (no cert digest parsed)" apksigner.log 1600
          else
            echo "::warning::apksigner unavailable; falling back to keytool (v1 signatures only)."
          fi

          if [[ -z "$APK_SHA256" ]]; then
            keytool -printcert -jarfile "$APK" 2>&1 | tee keytool-apk.log || true
            APK_SHA256="$(cert_sha_from_keytool_log keytool-apk.log)"
            [[ -n "$APK_SHA256" ]] || notice_b64 "keytool -printcert -jarfile output (no cert digest parsed)" keytool-apk.log 1200
          fi

          echo "Keystore cert SHA-256: ${EXPECTED_SHA256:-<unread>}"
          echo "APK cert      SHA-256: ${APK_SHA256:-<unread>}"

          if [[ -z "$APK_SHA256" ]]; then
            # Both readers failed, so this release cannot be PROVEN to carry the
            # release key. Publishing an unverified APK is exactly how users end
            # up with "package conflicts with an existing package", so refuse.
            echo "::error title=Signature not verified::Could not read the APK's signing certificate, so this release cannot be proven to carry the release key. Refusing to publish an unverified APK. The raw tool output is in the base64 annotation above; note that apksigner renamed this line in build-tools 37 to 'V2 Signer: certificate SHA-256 digest:'."
            exit 1
          fi

          if [[ "$APK_SHA256" != "$EXPECTED_SHA256" ]]; then
            # Name the most common cause instead of leaving it to be guessed.
            DEBUG_SHA=""
            DEBUG_KS="${HOME}/.android/debug.keystore"
            if [[ -f "$DEBUG_KS" ]]; then
              DEBUG_SHA="$(keytool -list -v -keystore "$DEBUG_KS" -storepass android \
                -alias androiddebugkey 2>/dev/null \
                | awk -F': ' '/SHA256:/ {gsub(/:/,"",$2); print toupper($2); exit}' || true)"
            fi
            if [[ -n "$DEBUG_SHA" && "$APK_SHA256" == "$DEBUG_SHA" ]]; then
              echo "::error title=Debug-signed APK::The APK is signed with the runner's DEBUG key (${DEBUG_SHA:0:16}…), not the release key. Gradle did not apply the release signing config: check SIGNING_KEYSTORE_FILE, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD and SIGNING_STORE_PASSWORD in the build step."
            else
              echo "::error title=Signature mismatch::The APK is NOT signed with the release keystore. APK cert ${APK_SHA256}, keystore cert ${EXPECTED_SHA256}. Publishing it would cause 'package conflicts with an existing package'."
            fi
            notice_b64 "apksigner verify --print-certs (APK)" apksigner.log 1600
            exit 1
          fi

          echo "✓ APK is signed with the stable release key ($APK_SHA256)."
          echo "::notice title=Release signing verified::APK certificate SHA-256 ${APK_SHA256} matches the keystore in SIGNING_KEY."

      - name: Read version from pubspec.yaml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(awk '/^version:/ { sub(/^version:[[:space:]]*/, ""); print; exit }' pubspec.yaml)"
          VERSION="${RAW%%+*}"
          BUILD="${RAW##*+}"
          [[ -n "$VERSION" ]] || { echo "::error::pubspec.yaml has no version"; exit 1; }
          [[ "$BUILD" =~ ^[0-9]+$ ]] || BUILD=0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"     >> "$GITHUB_OUTPUT"

          # Only meaningful on a tag push. When this workflow is called by
          # build_apk.yml the ref is `main`, which is not a tag and must not
          # produce a "does not match" warning.
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ -n "$TAG" && "$TAG" != "$VERSION" ]]; then
              echo "::warning::Tag v$TAG does not match pubspec version $VERSION. Publishing as v$VERSION."
            fi
          fi

      # latest.json lets the in-app updater compare the BUILD number too, not
      # just the semver tag, so a rebuild of the same version is still detected.
      - name: Write latest.json update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "build": $BUILD,
            "tag": "v$VERSION",
            "apk": "app-release.apk",
            "repository": "${GITHUB_REPOSITORY}",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: IfallMusic v${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})
          body_path: RELEASE_NOTES.md
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            latest.json
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: false

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Signed release published"
            echo ""
            echo "- Version: **v${{ steps.version.outputs.version }}** (build ${{ steps.version.outputs.build }})"
            echo "- Signing certificate SHA-256: \`${{ steps.signing.outputs.keystore_sha256 }}\`"
            echo "- Asset: \`app-release.apk\` (name required by the in-app updater)"
            echo ""
            echo "Same key as previous releases, so this installs over the old app."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Always remove the decoded key material, on success AND on failure.
      # ---------------------------------------------------------------------
      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "${RUNNER_TEMP:-/tmp}/signing"
          rm -f android/app/upload-keystore.jks android/key.properties
          LEFTOVER=0
          [[ -e "${RUNNER_TEMP:-/tmp}/signing" ]] && LEFTOVER=1
          [[ -e android/app/upload-keystore.jks ]] && LEFTOVER=1
          [[ -e android/key.properties ]] && LEFTOVER=1
          if (( LEFTOVER )); then
            echo "::error::Temporary keystore cleanup failed — inspect the runner."
            exit 1
          fi
          echo "Temporary keystore removed. Nothing key-related left on the runner."

      # Lift compiler/Gradle errors into job annotations so a failure is readable.
      - name: Extract errors (failure)
        if: failure()
        shell: bash
        run: |
          {
            grep -hE "^e: |^w: |error • |warning • " analyze.log build.log 2>/dev/null | head -60
            echo "--- gradle ---"
            awk '/\* What went wrong/,/^\* Try/' build.log 2>/dev/null | head -40
          } > errors.log || true
          if [[ -f test.log ]]; then
            # CRLF-free copy of the test log (the expanded reporter emits \r).
            tr '\r' '\n' < test.log > test-lines.log
            # Failure blocks, wherever they sit in the log. Every test file runs
            # in ONE `flutter test` invocation, so the first failing file can be
            # hundreds of lines above the tail; tailing alone used to hide it.
            {
              echo "--- tests: failure blocks ---"
              awk 'BEGIN { keep = 0 }
                   /EXCEPTION CAUGHT|\[E\]|Failed assertion|overflowed|A RenderFlex|The relevant error-causing widget|Which:|Expected:|Actual:|framework error/ { keep = 30 }
                   keep > 0 { print; keep-- }' test-lines.log | head -300
              echo "--- tests: tail ---"
              tail -40 test-lines.log
            } >> errors.log
          fi
          cat errors.log || true

          # GitHub drops everything after the first 4096 bytes of an annotation,
          # so the diagnostics are published in chunks instead of one message
          # that gets cut off mid-stack-trace.
          emit_annotations() { # emit_annotations <title> <file>
            local title="$1" file="$2" part n=0 body
            [[ -s "$file" ]] || return 0
            rm -f .diag.part.*
            split -C 3000 -d -a 2 "$file" .diag.part. || true
            for part in .diag.part.*; do
              [[ -s "$part" ]] || continue
              n=$((n + 1))
              body="$(python3 -c 'import sys; d=open(sys.argv[1],"rb").read().decode("utf-8","replace"); sys.stdout.write(d.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$part")"
              printf '::error title=%s (%d)::%s\n' "$title" "$n" "$body"
            done
          }
          emit_annotations "Release build diagnostics" errors.log

      - name: Upload diagnostics (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-diagnostics
          path: |
            analyze.log
            test.log
            test-lines.log
            build.log
            apksigner.log
            keytool-apk.log
            errors.log
          if-no-files-found: warn

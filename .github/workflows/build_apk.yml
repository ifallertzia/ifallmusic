name: Build Flutter APK

on:
  push:
    branches: [ main, master, arena/01a0e1e5-saxify-v1 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 21 required by AGP 9.x / Gradle 9.x used in this project's template
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # Latest stable Flutter — matches the project's Android template
      # (AGP 9.1.0, Gradle 9.3.1, Kotlin 2.4.0 require a recent Flutter)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors only, infos non-fatal)
        shell: bash
        run: set -o pipefail && flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      # Keep every unit/widget suite in the release gate so a failing test
      # cannot be hidden behind a successful APK build.
      - name: Test (unit + widget)
        shell: bash
        run: set -o pipefail && flutter test --reporter expanded 2>&1 | tee test.log

      # This must be the exact long-lived key used by the published app. Never
      # use a runner-generated debug key for release artifacts.
      - name: Configure stable Android release signing
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" || -z "$ANDROID_RELEASE_STORE_PASSWORD" || -z "$ANDROID_RELEASE_KEY_ALIAS" || -z "$ANDROID_RELEASE_KEY_PASSWORD" ]]; then
            echo "Configure the four ANDROID_RELEASE_* GitHub Actions secrets with the original app signing key before building a release." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          keyAlias=$ANDROID_RELEASE_KEY_ALIAS
          keyPassword=$ANDROID_RELEASE_KEY_PASSWORD
          storePassword=$ANDROID_RELEASE_STORE_PASSWORD
          EOF

      - name: Build APK (signed release on main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: set -o pipefail && flutter build apk --release 2>&1 | tee build.log

      - name: Build APK (debug validation on branches and PRs)
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: set -o pipefail && flutter build apk --debug 2>&1 | tee build.log

      - name: Upload signed release APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload debug validation APK artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build App Bundle (Play Store)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: set -o pipefail && flutter build appbundle --release 2>&1 | tee appbundle.log

      - name: Upload App Bundle Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # GitHub truncates what we can read from a failed run, so lift every
      # compiler error into job annotations + errors.log (readable via the API).
      - name: Extract compiler errors
        if: failure()
        shell: bash
        run: |
          {
            grep -hE "^e: |^w: |error • |warning • " analyze.log build.log appbundle.log 2>/dev/null | head -60
            echo "--- gradle ---"
            awk '/\* What went wrong/,/^\* Try/' build.log 2>/dev/null | head -30
          } > errors.log || true
          if [[ -f test.log ]]; then
            echo "--- tests ---" >> errors.log
            tr '\r' '\n' < test.log | tail -100 >> errors.log
          fi
          cat errors.log
          # One multiline annotation: GitHub limits annotations per step, and
          # per-line notices can hide the actual failing test behind pass lines.
          DETAILS="$(head -c 24000 errors.log)"
          DETAILS="${DETAILS//%/%25}"
          DETAILS="${DETAILS//$'\n'/%0A}"
          DETAILS="${DETAILS//$'\r'/%0D}"
          printf '::error title=Build diagnostics::%s\n' "$DETAILS"

      # Keep every analyzer/test/build log available if a blocking step fails.
      - name: Upload build diagnostics (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            analyze.log
            test.log
            build.log
            appbundle.log
            errors.log
          if-no-files-found: warn

      # Post the tail of the failed build log as a PR comment (curl, no gh)
      - name: Post build failure log to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          {
            echo "**❌ Build failed on commit \`${GITHUB_SHA::7}\`**"
            echo ''
            echo '```text'
            sed -n '1,120p' errors.log 2>/dev/null || echo "errors.log missing"
            echo '```'
            echo ''
            echo '```text'
            tail -60 build.log 2>/dev/null || echo "build.log missing"
            echo '```'
            echo ''
            echo '<details><summary>flutter analyze</summary>'
            echo ''
            echo '```text'
            tail -80 analyze.log 2>/dev/null || echo "analyze.log missing"
            echo '```'
            echo '</details>'
            echo ''
            echo '<details><summary>flutter test</summary>'
            echo ''
            echo '```text'
            tail -40 test.log 2>/dev/null || echo "test.log missing"
            echo '```'
            echo '</details>'
          } > comment.md
          jq -Rs '{body: .}' < comment.md > payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -d @payload.json | head -c 400

  # A release is created only after the complete build job succeeds on main.
  # PR and feature-branch builds produce artifacts but never publish releases.
  release:
    name: Publish versioned APK release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: release

      - name: Read app version
        id: version
        shell: bash
        run: |
          RAW_VERSION="$(awk '/^version:/ { sub(/^version:[[:space:]]*/, ""); print; exit }' pubspec.yaml)"
          VERSION="${RAW_VERSION%%+*}"
          if [[ -z "$VERSION" ]]; then
            echo "pubspec.yaml is missing a version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: IfallMusic v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true

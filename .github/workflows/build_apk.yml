name: Build Flutter APK

# CI gate for every push and pull request: analyze, test, and build the
# release-mode APK/AAB. On `main` it also bumps the Android build number and
# moves the release tag, which triggers `build.yml` to publish the signed APK.
#
# Signing secrets (all four, or none):
#   SIGNING_KEY / KEY_ALIAS / KEY_PASSWORD / STORE_PASSWORD
# Legacy ANDROID_RELEASE_* names are still accepted for compatibility.

on:
  push:
    branches: [ main, master, 'arena/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 21 required by AGP 9.x / Gradle 9.x used in this project's template
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # Latest stable Flutter — matches the project's Android template
      # (AGP 9.1.0, Gradle 9.3.1, Kotlin 2.4.0 require a recent Flutter)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors only, infos non-fatal)
        shell: bash
        run: set -o pipefail && flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      # Keep every unit/widget suite in the release gate so a failing test
      # cannot be hidden behind a successful APK build.
      - name: Test (unit + widget)
        shell: bash
        run: set -o pipefail && flutter test --reporter expanded 2>&1 | tee test.log

      # -------------------------------------------------------------------
      # Decode the stable release key into a TEMPORARY path outside the
      # checkout. Gradle reads the credentials from the environment; nothing
      # is hardcoded in android/app/build.gradle.kts.
      #
      # Without secrets this stays a warning (fork PRs have no secret access),
      # but the APK is then debug-signed and must not be distributed.
      # -------------------------------------------------------------------
      # -------------------------------------------------------------------
      # Decode the stable release key into a TEMPORARY path outside the
      # checkout. Gradle reads the credentials from the environment; nothing
      # is hardcoded in android/app/build.gradle.kts.
      #
      # SIGNING_REQUIRED=false: a fork PR has no secret access, so a missing
      # key warns and falls back to debug signing. A PRESENT but invalid key
      # still fails, and a wrong key is caught by the pinned fingerprint.
      # -------------------------------------------------------------------
      - name: Configure Android release signing
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY || secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          SIGNING_REQUIRED: 'false'
        shell: bash
        run: bash scripts/ci_prepare_signing.sh

      # Validate the same release-mode APK/AAB on PRs as on main, so a green
      # debug-only PR cannot hide release build failures.
      - name: Build APK (release)
        env:
          SIGNING_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          SIGNING_KEYSTORE_TYPE: JKS
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        shell: bash
        run: set -o pipefail && flutter build apk --release 2>&1 | tee build.log

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build App Bundle (release validation)
        env:
          SIGNING_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          SIGNING_KEYSTORE_TYPE: JKS
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        shell: bash
        run: set -o pipefail && flutter build appbundle --release 2>&1 | tee appbundle.log

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Temporary key material must not survive the job, pass or fail.
      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP:-/tmp}/signing"
          rm -f android/app/upload-keystore.jks android/key.properties
          echo "Temporary keystore removed."

      # GitHub truncates what we can read from a failed run, so lift every
      # compiler error into job annotations + errors.log (readable via the API).
      - name: Extract compiler errors
        if: failure()
        shell: bash
        run: |
          {
            grep -hE "^e: |^w: |error • |warning • " analyze.log build.log appbundle.log 2>/dev/null | head -60
            echo "--- gradle ---"
            awk '/\* What went wrong/,/^\* Try/' build.log 2>/dev/null | head -30
          } > errors.log || true
          if [[ -f test.log ]]; then
            echo "--- tests ---" >> errors.log
            tr '\r' '\n' < test.log | tail -100 >> errors.log
          fi
          cat errors.log
          # One multiline annotation: GitHub limits annotations per step, and
          # per-line notices can hide the actual failing test behind pass lines.
          DETAILS="$(head -c 24000 errors.log)"
          DETAILS="${DETAILS//%/%25}"
          DETAILS="${DETAILS//$'\n'/%0A}"
          DETAILS="${DETAILS//$'\r'/%0D}"
          printf '::error title=Build diagnostics::%s\n' "$DETAILS"

      # Keep every analyzer/test/build log available if a blocking step fails.
      - name: Upload build diagnostics (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            analyze.log
            test.log
            build.log
            appbundle.log
            errors.log
          if-no-files-found: warn

      # Post the tail of the failed build log as a PR comment (curl, no gh)
      - name: Post build failure log to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          {
            echo "**❌ Build failed on commit \`${GITHUB_SHA::7}\`**"
            echo ''
            echo '```text'
            sed -n '1,120p' errors.log 2>/dev/null || echo "errors.log missing"
            echo '```'
            echo ''
            echo '```text'
            tail -60 build.log 2>/dev/null || echo "build.log missing"
            echo '```'
            echo ''
            echo '<details><summary>flutter analyze</summary>'
            echo ''
            echo '```text'
            tail -80 analyze.log 2>/dev/null || echo "analyze.log missing"
            echo '```'
            echo '</details>'
            echo ''
            echo '<details><summary>flutter test</summary>'
            echo ''
            echo '```text'
            tail -40 test.log 2>/dev/null || echo "test.log missing"
            echo '```'
            echo '</details>'
          } > comment.md
          jq -Rs '{body: .}' < comment.md > payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -d @payload.json | head -c 400

  # ---------------------------------------------------------------------------
  # Automatic build-number increment.
  #
  # Android needs a strictly increasing versionCode (pubspec's `+N`) or it will
  # not treat the new APK as an update. Bumping it by hand is how releases end
  # up flat and users hit "package conflicts", so main pushes bump it here.
  # The tag push then triggers build.yml, which publishes the signed release.
  # ---------------------------------------------------------------------------
  bump-and-release:
    name: Bump build number & move release tag
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'ifallertzia/Saxify-v1' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Needed to push the bump commit and the tag back to main.
          persist-credentials: true

      - name: Bump build number and sync branding
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(bash scripts/bump_build_number.sh --check)"
          bash scripts/bump_build_number.sh
          AFTER="$(bash scripts/bump_build_number.sh --check)"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER"   >> "$GITHUB_OUTPUT"
          echo "version=${AFTER%%+*}" >> "$GITHUB_OUTPUT"
          echo "Version ${BEFORE} -> ${AFTER}"
          git --no-pager diff --stat

      - name: Commit bumped version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pubspec.yaml lib/config/branding.dart; then
            echo "No version change to commit."
            exit 0
          fi
          git add pubspec.yaml lib/config/branding.dart
          git commit -m "chore(release): bump build number to ${{ steps.bump.outputs.after }} [skip ci]"
          git push origin HEAD:main

      - name: Move release tag (triggers the signed release build)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="v$VERSION"
          git tag -f "$TAG"
          # Force-move so a build-number-only change still publishes a fresh APK.
          git push -f origin "$TAG"
          echo "Pushed $TAG — build.yml will publish the signed release."

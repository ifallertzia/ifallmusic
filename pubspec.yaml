name: ifallmusic
description: Sidify — stream beyond limits. A premium glass music app.
publish_to: 'none'
version: 2.10.0+47

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Playback engine (UNCHANGED behaviour, only re-homed into services) ---
  just_audio: ^0.9.40
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  youtube_explode_dart: ^3.1.0

  # --- In-app movie/series video player (media_kit / libmpv) ---
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # --- Frontend only ---
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1


  # --- Phase 2: in-app updates, downloads, on-device recommendations ---
  package_info_plus: ^8.0.0
  unorm_dart: ^0.3.0
  html: ^0.15.4
  http: ^1.2.0
  path_provider: ^2.1.0
  open_filex: ^4.7.0
  dio: ^5.7.0
  permission_handler: ^11.4.0
  speech_to_text: ^7.0.0
  sqflite: ^2.4.1
  workmanager: ^0.10.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # The Sidify logo: the uploaded logo photo, full (mark + wordmark) and
    # cropped to the mark alone. Every logo slot in the app uses one of these.
    - assets/images/sidify_logo.png
    - assets/images/sidify_mark.png
